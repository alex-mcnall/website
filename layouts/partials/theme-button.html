<button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" Title="Toggle colour scheme">
  <div class="toggle-track border-gray-700 dark:border-white border-1 bg-black/10 dark:bg-white/10">
    <div class="toggle-thumb bg-white dark:bg-white/10">
      <i class="color-scheme-icon icon-moon fa-solid fa-moon"></i>
      <i class="color-scheme-icon icon-sun fa-solid fa-sun"></i>
    </div>
  </div>
</button>
