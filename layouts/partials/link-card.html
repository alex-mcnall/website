<div class="space-y-4 mb-8">

    {{ range .Params.links }}

      <a href="{{ .href }}" target="_blank" rel="noopener noreferrer" class="group block link-card p-4 flex items-center border-1 border-gray-700 dark:border-white rounded-3xl bg-black/10 dark:bg-white/10 hover:bg-white/10 dark:hover:bg-white/20 hover:-translate-y-2 hover:shadow-lg shadow-black/30 dark:shadow-white/30 transition duration-300 active:bg-white/10 dark:active:bg-white/20 active:-translate-y-2 active:shadow-lg active:shadow-blue-400/30">
        <div class="w-10 h-10 flex items-center justify-center mr-4 group-hover:scale-110">
          <i class="{{ .icon }} icon text-xl"></i>
        </div>
        <div>
          <h3 class="font-medium">{{ .title }}</h3>
          <p class="text-sm opacity-70">{{ .description }}</p>
        </div>
      </a>

    {{ end }}

</div>
