name: Build and create release

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 1 # Gather only the current version of the theme
          path: website
      
      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.162.1'
          extended: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install Node.js dependencies
        working-directory: website
        run: npm ci

      - name: Build
        working-directory: website
        run: npm run build --if-present

      - name: Package website files
        working-directory: website
        run: |
          test -d public
          tar -czf "website-${GITHUB_SHA}.tar.gz" -C public .

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: "website-${{ github.sha }}"
          path: "website/website-${{ github.sha }}.tar.gz"
          compression-level: 0
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: website-${{ github.sha }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="website-${GITHUB_SHA}"

          gh release create "$release_tag" \
            "${release_tag}.tar.gz" \
            --target "$GITHUB_SHA" \
            --title "Version ${GITHUB_SHA}"
