version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22.x
    command:
      - apt-get update -y
      - apt-get install hugo
  pre_build:
    command:
      - npm ci
  build:
    command:
      - npm run build --if-present
      - tar -czf "website.tar.gz" -C public .

artifacts:
  files: 
    - website.tar.gz
  name: website-${CODEBUILD_RESOLVED_SOURCE_VERSION:-unknown}
